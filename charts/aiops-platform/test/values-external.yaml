# Every dependency switched to an external system; rendered by
# hack/chart-lint.sh. Hostnames are examples, not live systems.
global:
  parentDomain: platform.example.com

secrets:
  # A Secret the operator created with the platform keys; the hook copies
  # it into secrets.name.
  existingSecret: my-platform-secrets
  generate: false

gateway:
  enabled: true
  create: true
  className: eg
  tls:
    secretName: platform-wildcard-tls
    certificate:
      create: true
      issuerRef:
        name: letsencrypt
        kind: ClusterIssuer

postgresql:
  enabled: false
  external:
    host: db.internal.example.com
    port: 5432
    database: aiops
    username: aiops
    existingSecret: aiops-db

keycloak:
  enabled: false
  external:
    issuer: https://sso.example.com/realms/aiops
    existingSecret: aiops-oidc

litellm:
  enabled: false
  external:
    url: https://litellm.example.com
    existingSecret: aiops-litellm-key

ui:
  grafanaUrl: https://grafana.example.com
