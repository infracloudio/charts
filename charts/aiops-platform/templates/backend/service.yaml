apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-platform.backendFullname" . }}
  labels:
    {{- include "aiops-platform.labelsForComponent" (dict "root" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aiops-platform.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
