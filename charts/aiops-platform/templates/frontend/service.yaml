apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-platform.frontendFullname" . }}
  labels:
    {{- include "aiops-platform.labelsForComponent" (dict "root" . "component" "frontend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aiops-platform.componentLabels" (dict "root" . "component" "frontend") | nindent 4 }}
