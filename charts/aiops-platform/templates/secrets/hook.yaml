{{- if .Values.secrets.hook.enabled }}
{{- $name := printf "%s-secrets-init" (include "aiops-platform.fullname" .) }}
# Runs before every install and upgrade, before any other object: the
# platform Secret must exist before the subcharts (auth.existingSecret,
# masterkeySecretName) and the Deployments start. `lookup` returns nothing
# under `helm template`/`--dry-run` and cannot keep generated values stable
# across upgrades without writing them into the release manifest, so a
# hook Job writes the Secrets once.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  secrets-init.sh: |-
    {{- .Files.Get "files/secrets-init.sh" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "aiops-platform.componentLabels" (dict "root" . "component" "secrets-init") | nindent 8 }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      containers:
        - name: secrets-init
          image: {{ .Values.secrets.hook.image | quote }}
          command: ["sh", "/scripts/secrets-init.sh"]
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: PLATFORM_SECRET
              value: {{ .Values.secrets.name | quote }}
            - name: SOURCE_SECRET
              value: {{ .Values.secrets.existingSecret | quote }}
            - name: GENERATE
              value: {{ .Values.secrets.generate | quote }}
            - name: KEYCLOAK_SECRET
              value: {{ include "aiops-platform.keycloakSecret" . | quote }}
            - name: WRITE_LITELLM_ENV
              value: {{ .Values.litellm.enabled | quote }}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}
{{- end }}
