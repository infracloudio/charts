{{- if and .Values.langflow.enabled .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aiops-platform.langflowFullname" . }}
  labels:
    {{- include "aiops-platform.labelsForComponent" (dict "root" . "component" "langflow") | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "aiops-platform.gatewayName" . }}
      namespace: {{ include "aiops-platform.gatewayNamespace" . }}
  hostnames:
    - {{ include "aiops-platform.langflowHost" . | quote }}
  rules:
    - backendRefs:
        - name: {{ include "aiops-platform.langflowFullname" . }}
          port: 7860
{{- end }}
