{{- if .Values.langflow.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops-platform.langflowFullname" . }}
  labels:
    {{- include "aiops-platform.labelsForComponent" (dict "root" . "component" "langflow") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7860
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aiops-platform.componentLabels" (dict "root" . "component" "langflow") | nindent 4 }}
{{- end }}
