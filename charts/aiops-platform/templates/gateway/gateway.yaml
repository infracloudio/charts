{{- if and .Values.gateway.enabled .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "aiops-platform.fullname" . }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.{{ .Values.global.parentDomain }}"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.{{ .Values.global.parentDomain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ required "gateway.tls.secretName is required when gateway.create is true" .Values.gateway.tls.secretName }}
      allowedRoutes:
        namespaces:
          from: All
{{- end }}
