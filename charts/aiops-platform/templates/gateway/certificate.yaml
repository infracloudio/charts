{{- if and .Values.gateway.enabled .Values.gateway.tls.certificate.create }}
# A cert-manager Certificate for the parent domain, in the Gateway's
# namespace so the listener can reference its Secret. With
# gateway.create=false the Secret must be added to the existing listener's
# certificateRefs by hand (make chart-install does this on kind).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "aiops-platform.fullname" . }}-wildcard
  namespace: {{ include "aiops-platform.gatewayNamespace" . }}
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
spec:
  secretName: {{ required "gateway.tls.secretName is required when gateway.tls.certificate.create is true" .Values.gateway.tls.secretName }}
  dnsNames:
    - "*.{{ .Values.global.parentDomain }}"
    - {{ .Values.global.parentDomain | quote }}
  issuerRef:
    name: {{ required "gateway.tls.certificate.issuerRef.name is required" .Values.gateway.tls.certificate.issuerRef.name }}
    kind: {{ .Values.gateway.tls.certificate.issuerRef.kind }}
{{- end }}
