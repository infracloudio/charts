{{- if .Values.gateway.enabled }}
{{- $gateway := include "aiops-platform.gatewayName" . }}
{{- $gatewayNamespace := include "aiops-platform.gatewayNamespace" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aiops-platform.fullname" . }}-ui
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ include "aiops-platform.host" (dict "root" . "label" .Values.gateway.hosts.ui) | quote }}
  rules:
    - backendRefs:
        - name: {{ include "aiops-platform.frontendFullname" . }}
          port: 80
{{- if .Values.viz.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aiops-platform.fullname" . }}-viz
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ include "aiops-platform.host" (dict "root" . "label" .Values.gateway.hosts.viz) | quote }}
  rules:
    - backendRefs:
        - name: {{ include "aiops-platform.vizFullname" . }}
          port: 80
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aiops-platform.fullname" . }}-api
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ include "aiops-platform.host" (dict "root" . "label" .Values.gateway.hosts.api) | quote }}
  rules:
    - backendRefs:
        - name: {{ include "aiops-platform.backendFullname" . }}
          port: 8000
{{- if .Values.keycloak.enabled }}
---
# The browser and curl entry point for the realm; the OIDC policy reaches
# Keycloak in-cluster through the Service, not through this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "aiops-platform.fullname" . }}-auth
  labels:
    {{- include "aiops-platform.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $gateway }}
      namespace: {{ $gatewayNamespace }}
  hostnames:
    - {{ include "aiops-platform.host" (dict "root" . "label" .Values.gateway.hosts.auth) | quote }}
  rules:
    - backendRefs:
        - name: {{ .Values.keycloak.fullnameOverride }}
          port: {{ .Values.keycloak.service.ports.http }}
{{- end }}
{{- end }}
