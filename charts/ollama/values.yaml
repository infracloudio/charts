replicaCount: 1

image:
  repository: ollama/ollama
  pullPolicy: IfNotPresent
  # Defaults to the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  # The Service port; the container always listens on 11434.
  port: 80

ollama:
  # OLLAMA_HOST inside the pod.
  host: "0.0.0.0:11434"
  # How long a loaded model stays in memory after the last request.
  keepAlive: "1h"
  # Default context window; small models on CPU do not need more.
  contextLength: 4096

models:
  # Tags pulled by a postStart hook after the server answers. The kubelet
  # runs the readiness probe only after the hook returns, so the pod is
  # Ready once every model is on disk.
  pull: []

# Extra environment variables, in container form.
env: []

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi

persistence:
  enabled: true
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  # Use a PVC that already exists instead of creating one.
  existingClaim: ""

livenessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /api/version
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}
