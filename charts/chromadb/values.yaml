# Default values for chromadb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

kind: Deployment

strategy: {}
  # rollingUpdate:
  #   maxSurge: 1
  #   maxUnavailable: 1
  # type: RollingUpdate

image:
  repository: ghcr.io/chroma-core/chroma
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

env: 
  - name: ANONYMIZED_TELEMETRY
    value: "False"
  - name: ALLOW_RESET
    value: "True"
  - name: IS_PERSISTENT
    value: "True"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8000

serviceMonitor:
  # Enable the creation of a ServiceMonitor resource
  enabled: false
  # Specify the namespace the ServiceMonitor resource should be created in
  namespace: ""
  # Specify the interval at which metrics should be scraped
  interval: 30s
  # Specify the scrape timeout
  scrapeTimeout: 10s
  # path to scrape for metrics
  path: /metrics
  # additional labels to add to the ServiceMonitor
  additionalLabels: {}

# Gateway API route (https://gateway-api.sigs.k8s.io/), rendered only when
# enabled. It replaces the former Ingress resource and expects a Gateway
# such as Envoy Gateway to exist in the cluster.
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: aiops
      namespace: envoy-gateway-system
  hostnames: []
  path: /

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Chroma's health/heartbeat endpoint moved to /api/v2/heartbeat in the
# Chroma 1.x server (the older /api/v1/heartbeat path is gone).
livenessProbe:
  httpGet:
    path: /api/v2/heartbeat
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /api/v2/heartbeat
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 4

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition, alongside the
# "data" volume backed by the PVC below (see pvc.enabled / pvc.mountPath).
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition, alongside
# the "data" volumeMount backed by the PVC below (see pvc.enabled / pvc.mountPath).
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}


pvc:
  enabled: true

  # Name of an existing PVC to use instead of creating one. Leave empty to
  # let this chart create and manage the PVC below.
  existingClaim: ""

  # Where the "data" volume is mounted in the container. Chroma's 1.x
  # server image persists to /data by default (no PERSIST_DIRECTORY /
  # IS_PERSISTENT env vars needed).
  mountPath: /data

  persistentVolumeClaim:
    ## Ref: http://kubernetes.io/docs/user-guide/persistent-volum
    ##
    ## ReadWriteOnce is the safe default: it binds on single-node
    ## provisioners such as kind's local-path-provisioner, which do not
    ## support ReadWriteMany. Override to ReadWriteMany only if your
    ## storage class actually supports it and you need multiple replicas.
    accessModes:
      - ReadWriteOnce

    ## Left empty by default so the PVC name is derived from the release
    ## (via the chromadb.fullname template helper). This avoids name
    ## collisions when installing a second release of this chart in the
    ## same namespace. Set explicitly to pin a stable name instead.
    name: ""

    labels: {}

    annotations: {}

    storageClassName: ""

    size: "2Gi"
